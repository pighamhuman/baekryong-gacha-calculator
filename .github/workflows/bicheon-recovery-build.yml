name: Bicheon Recovery APK
on:
  push:
    branches: [bicheon-recovery-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Structural QA
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | tee /tmp/list.txt
          grep -q 'classes.dex' /tmp/list.txt
          for DEX in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do unzip -p "$APK" "$DEX" | strings; done > /tmp/dexstrings.txt
          grep -q 'AdvisorEngine' /tmp/dexstrings.txt
          grep -q 'AdvisorService' /tmp/dexstrings.txt
          grep -q 'MediaProjection' /tmp/dexstrings.txt
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.bicheon.advisor.dev356'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.bicheon.advisor.dev356.MainActivity'" /tmp/badging.txt
          SIZE=$(stat -c%s "$APK"); echo "APK bytes=$SIZE"; test "$SIZE" -gt 10000
          sha256sum "$APK"
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk BicheonMatchAdvisor-v3.5.6-RECOVERY-RUNTIME-FIX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BicheonMatchAdvisor-v3.5.6-RECOVERY-RUNTIME-FIX
          path: BicheonMatchAdvisor-v3.5.6-RECOVERY-RUNTIME-FIX.apk
          if-no-files-found: error
          retention-days: 7
