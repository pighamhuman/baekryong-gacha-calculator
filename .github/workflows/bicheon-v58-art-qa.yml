name: Bicheon V58 ART QA

on:
  push:
    branches:
      - qa/bicheon-v58-art-20260822
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  art-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct exact V58 DEX and build harness
        shell: bash
        run: |
          set -euo pipefail
          bash qa/target/assemble.sh
          gradle --no-daemon :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Run exact Solver on Android ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.bicheon.qa/.MainActivity

            PASSED=0
            for i in $(seq 1 180); do
              adb logcat -d -v brief > art-log.txt
              if grep -q 'BICHEON_QA.*PASS completedCalls=12' art-log.txt; then
                PASSED=1
                break
              fi
              if grep -q 'BICHEON_QA.*FAIL ' art-log.txt; then
                cat art-log.txt
                exit 1
              fi
              sleep 1
            done

            cat art-log.txt
            test "$PASSED" -eq 1
            test "$(grep -c 'BICHEON_QA.*CALL case=' art-log.txt)" -eq 12
            ! grep -E 'VerifyError|NoSuchMethodError|NullPointerException|FATAL EXCEPTION|Solver timeout' art-log.txt

      - name: Upload ART runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bicheon-v58-art-qa-log
          path: art-log.txt
          if-no-files-found: warn
          retention-days: 14
